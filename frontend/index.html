<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FAKESHOP</title>
    <!-- Подключаем Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Подключаем стили -->
    <link rel="stylesheet" href="/static/style.css">
    <!-- Иконки (Font Awesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <!-- ========== ШАПКА ========== -->
    <header class="header">
        <div class="header-top">
            <div class="header-left">
                <span class="logo">🔥 FAKESHOP</span>
            </div>
            <div class="header-right">
                <button class="header-btn" id="searchToggle">
                    <i class="fas fa-search"></i>
                </button>
                <!-- Кнопка админки (скрыта по умолчанию, показывается только админам) -->
                <button class="header-btn" id="adminBtn" style="display: none;" onclick="location.href='/admin'">
                    <i class="fas fa-crown"></i>
                </button>
                <button class="header-btn" id="cartBtn">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-badge" id="cartBadge">0</span>
                </button>
            </div>
        </div>
        <!-- Поисковая строка (скрыта по умолчанию) -->
        <div class="search-container" id="searchContainer">
            <input type="text" id="searchInput" placeholder="Поиск товаров..." class="search-input">
            <button class="search-clear" id="searchClear"><i class="fas fa-times"></i></button>
        </div>
        <!-- Категории (горизонтальный скролл) -->
        <div class="categories-scroll" id="categoriesContainer">
            <button class="category-btn active" data-category="Все">Все</button>
            <!-- Остальные категории подгрузятся из API -->
        </div>
    </header>

    <!-- ========== ОСНОВНОЙ КОНТЕНТ ========== -->
    <main class="main-content" id="mainContent">
        <!-- Скелетон загрузки -->
        <div class="skeleton-grid" id="skeletonGrid">
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
        </div>
        
        <!-- Сетка товаров -->
        <div class="products-grid" id="productsGrid"></div>
        
        <!-- Кнопка "Загрузить еще" -->
        <div class="load-more-container" id="loadMoreContainer" style="display: none;">
            <button class="load-more-btn" id="loadMoreBtn">Загрузить еще</button>
        </div>
        
        <!-- Сообщение "Товаров нет" -->
        <div class="empty-state" id="emptyState" style="display: none;">
            <i class="fas fa-box-open"></i>
            <p>Товаров не найдено</p>
        </div>
    </main>

    <!-- ========== КОРЗИНА (выезжающая панель) ========== -->
    <div class="cart-overlay" id="cartOverlay"></div>
    <div class="cart-panel" id="cartPanel">
        <div class="cart-header">
            <span class="cart-title">🛒 Корзина</span>
            <button class="cart-close" id="cartClose"><i class="fas fa-times"></i></button>
        </div>
        <div class="cart-body" id="cartBody">
            <div class="cart-empty">
                <i class="fas fa-shopping-basket"></i>
                <p>Корзина пуста</p>
            </div>
            <div class="cart-items" id="cartItems"></div>
        </div>
        <div class="cart-footer" id="cartFooter" style="display: none;">
            <div class="cart-total">
                <span>Итого:</span>
                <span class="cart-total-price" id="cartTotal">0 BYN</span>
            </div>
            <button class="checkout-btn" id="checkoutBtn">Оформить заказ</button>
        </div>
    </div>

    <!-- ========== МОДАЛКА ТОВАРА ========== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-container" id="modalContainer">
            <button class="modal-close" id="modalClose"><i class="fas fa-times"></i></button>
            <div class="modal-content" id="modalContent">
                <!-- Сюда подгружается карточка товара -->
            </div>
        </div>
    </div>

    <!-- ========== МОДАЛКА ЗАКАЗА ========== -->
    <div class="modal-overlay" id="orderModalOverlay">
        <div class="modal-container order-modal" id="orderModalContainer">
            <button class="modal-close" id="orderModalClose"><i class="fas fa-times"></i></button>
            <div class="modal-content" id="orderModalContent">
                <div class="order-success" id="orderSuccess" style="display: none;">
                    <i class="fas fa-check-circle"></i>
                    <h2>Заказ оформлен!</h2>
                    <p id="orderNumberText">Номер заказа: <strong>#FAKE-2026...</strong></p>
                    <p>Ожидайте, менеджер свяжется с вами</p>
                    <button class="order-close-btn" id="orderCloseBtn">Понятно</button>
                </div>
                <div class="order-form" id="orderForm">
                    <h2>Оформление заказа</h2>
                    <div class="form-group">
                        <label>Ваш номер телефона</label>
                        <input type="tel" id="orderPhone" placeholder="+375 XX XXX-XX-XX" required>
                    </div>
                    <div class="form-group">
                        <label>Адрес доставки (опционально)</label>
                        <input type="text" id="orderAddress" placeholder="Город, улица, дом...">
                    </div>
                    <div class="form-group">
                        <label>Комментарий к заказу</label>
                        <textarea id="orderComment" placeholder="Дополнительная информация..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>Промокод</label>
                        <div class="promo-input-group">
                            <input type="text" id="orderPromo" placeholder="Введите промокод">
                            <button class="promo-apply-btn" id="promoApplyBtn">Применить</button>
                        </div>
                        <div class="promo-info" id="promoInfo"></div>
                    </div>
                    <div class="order-summary">
                        <div class="order-summary-row">
                            <span>Товары:</span>
                            <span id="orderSubtotal">0 BYN</span>
                        </div>
                        <div class="order-summary-row discount-row" id="discountRow" style="display: none;">
                            <span>Скидка:</span>
                            <span id="orderDiscount">-0 BYN</span>
                        </div>
                        <div class="order-summary-row total-row">
                            <span>Итого:</span>
                            <span id="orderTotal">0 BYN</span>
                        </div>
                    </div>
                    <button class="submit-order-btn" id="submitOrderBtn">✅ Подтвердить заказ</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ========== УВЕДОМЛЕНИЕ ========== -->
    <div class="toast" id="toast"></div>

    <!-- Подключаем JavaScript -->
    <script src="/static/script.js"></script>
</body>
</html>
